name: Yamtrack
version: "0.1.5"
slug: yamtrack
description: Self-hosted media tracker with an upcoming-episodes calendar (.ics feed)
url: https://github.com/FuzzyGrim/Yamtrack
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
backup: cold
ports:
  8000/tcp: 8000
ports_description:
  8000/tcp: Yamtrack web UI
webui: "http://[HOST]:[PORT:8000]"
options:
  secret: ""
  timezone: "UTC"
  urls: ""
  tmdb_api_key: ""
  registration: true
  base_url: ""
schema:
  secret: password?
  timezone: str
  urls: str?
  tmdb_api_key: password?
  registration: bool
  base_url: str?
